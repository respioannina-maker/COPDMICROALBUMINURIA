<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRF COPD Study</title>
<style>
  body { font-family: Arial; padding: 20px; max-width: 900px; margin:auto; }
  h1 { text-align:center; }
  .card { border: 1px solid #ccc; border-radius: 10px; padding: 12px; margin: 12px 0; background:#f9f9f9; }
  label { display:block; margin: 6px 0; }
  input, select { width:100%; padding:6px; }
  button { padding:12px; width:100%; margin-top:10px; }
  #status { font-weight:bold; margin-top:12px; text-align:center; }
</style>
</head>
<body>

<h1>CRF COPD – Συλλογή Δεδομένων</h1>

<form id="crfForm">

<section class="card">
  <h2>🆔 Ταυτότητα</h2>

  <label>NPS (Μοναδικός Κωδικός Ασθενούς)
    <input type="text" name="NPS" required placeholder="π.χ. NPS-0001">
  </label>

  <label>Ονοματεπώνυμο
    <input type="text" name="Ονοματεπώνυμο" placeholder="π.χ. Παπαδόπουλος Ιωάννης">
  </label>

  <label>Ενότητα
    <select name="Section" id="Section" required>
      <option value="">— Επιλέξτε —</option>
      <option value="Δημογραφικά/Ιστορικό">Δημογραφικά/Ιστορικό</option>
      <option value="T0">T0</option>
      <option value="T1">T1</option>
      <option value="T2">T2</option>
      <option value="T3">T3</option>
      <option value="Σταθερή φάση">Σταθερή φάση</option>
      <option value="Reh1">Reh1</option>
    </select>
  </label>

  <label>Ημερομηνία
    <input type="date" name="Ημερομηνία">
  </label>
<!-- Δημογραφικά / Ιστορικό -->
<section class="card section" data-section="Δημογραφικά/Ιστορικό" style="display:none;">
  <h2>Δημογραφικά / Ιστορικό</h2>

  <label>Ηλικία <input type="number" name="Ηλικία"></label>
  <label>Φύλο <input type="text" name="Φύλο"></label>
  <label>BMI <input type="number" step="0.1" name="BMI"></label>
  <label>Κάπνισμα <input type="text" name="Κάπνισμα"></label>
  <label>Pack-years <input type="number" name="Pack-years"></label>

  <label>Παροξύνσεις τελευταίου έτους <input type="number" name="Παροξύνσεις τελευταίου έτους"></label>
  <label>Νοσηλείες τελευταίου έτους <input type="number" name="Νοσηλείες τελευταίου έτους"></label>

  <label>CAT score <input type="number" name="CAT score"></label>
  <label>mMRC <input type="number" name="mMRC"></label>
</section>


<!-- T0 -->
<section class="card section" data-section="T0" style="display:none;">
  <h2>T0 (Εισαγωγή)</h2>

  <label>CRP (mg/L) <input type="number" step="0.1" name="CRP (mg/L)"></label>
  <label>Ινωδογόνο (mg/dL) <input type="number" name="Ινωδογόνο (mg/dL)"></label>
  <label>D-dimers (μg/mL FEU) <input type="number" step="0.1" name="D-dimers (μg/mL FEU)"></label>

  <label>Αλβουμίνη ούρων (mg/L) <input type="number" step="0.01" name="Αλβουμίνη ούρων (mg/L)"></label>
  <label>Κρεατινίνη ούρων (mg/dL) <input type="number" step="0.01" name="Κρεατινίνη ούρων (mg/dL)"></label>

  <label>Ολική χοληστερίνη (mg/dL) <input type="number" name="Ολική χοληστερίνη (mg/dL)"></label>
  <label>LDL (mg/dL) <input type="number" name="LDL (mg/dL)"></label>
  <label>HDL (mg/dL) <input type="number" name="HDL (mg/dL)"></label>
  <label>Τριγλυκερίδια (mg/dL) <input type="number" name="Τριγλυκερίδια (mg/dL)"></label>
</section>


<!--

</section>
<!-- T1 -->
<section class="card section" data-section="T1" style="display:none;">
  <h2>T1</h2>
  <label>CRP (mg/L) <input type="number" step="0.1" name="CRP (mg/L)"></label>
  <label>Αλβουμίνη ούρων (mg/L) <input type="number" step="0.01" name="Αλβουμίνη ούρων (mg/L)"></label>
  <label>Κρεατινίνη ούρων (mg/dL) <input type="number" step="0.01" name="Κρεατινίνη ούρων (mg/dL)"></label>
</section>

<!-- T2 -->
<section class="card section" data-section="T2" style="display:none;">
  <h2>T2</h2>
  <label>CRP (mg/L) <input type="number" step="0.1" name="CRP (mg/L)"></label>
  <label>Αλβουμίνη ούρων (mg/L) <input type="number" step="0.01" name="Αλβουμίνη ούρων (mg/L)"></label>
  <label>Κρεατινίνη ούρων (mg/dL) <input type="number" step="0.01" name="Κρεατινίνη ούρων (mg/dL)"></label>
</section>

<!-- T3 -->
<section class="card section" data-section="T3" style="display:none;">
  <h2>T3</h2>
  <label>CRP (mg/L) <input type="number" step="0.1" name="CRP (mg/L)"></label>
  <label>Ινωδογόνο (mg/dL) <input type="number" name="Ινωδογόνο (mg/dL)"></label>
  <label>D-dimers (μg/mL FEU) <input type="number" step="0.1" name="D-dimers (μg/mL FEU)"></label>

  <label>Ολική χοληστερίνη (mg/dL) <input type="number" name="Ολική χοληστερίνη (mg/dL)"></label>
  <label>LDL (mg/dL) <input type="number" name="LDL (mg/dL)"></label>
  <label>HDL (mg/dL) <input type="number" name="HDL (mg/dL)"></label>
  <label>Τριγλυκερίδια (mg/dL) <input type="number" name="Τριγλυκερίδια (mg/dL)"></label>

  <label>Κρεατινίνη (mg/dL) <input type="number" step="0.01" name="Κρεατινίνη (mg/dL)"></label>
  <label>Αλβουμίνη ούρων (mg/L) <input type="number" step="0.01" name="Αλβουμίνη ούρων (mg/L)"></label>
  <label>Κρεατινίνη ούρων (mg/dL) <input type="number" step="0.01" name="Κρεατινίνη ούρων (mg/dL)"></label>
</section>

<!-- Σταθερή φάση -->
<section class="card section" data-section="Σταθερή φάση" style="display:none;">
  <h2>Σταθερή φάση</h2>
  <label>CRP (mg/L) <input type="number" step="0.1" name="CRP (mg/L)"></label>
  <label>Ινωδογόνο (mg/dL) <input type="number" name="Ινωδογόνο (mg/dL)"></label>

  <label>Ολική χοληστερίνη (mg/dL) <input type="number" name="Ολική χοληστερίνη (mg/dL)"></label>
  <label>LDL (mg/dL) <input type="number" name="LDL (mg/dL)"></label>
  <label>HDL (mg/dL) <input type="number" name="HDL (mg/dL)"></label>
  <label>Τριγλυκερίδια (mg/dL) <input type="number" name="Τριγλυκερίδια (mg/dL)"></label>

  <label>Αλβουμίνη ούρων (mg/L) <input type="number" step="0.01" name="Αλβουμίνη ούρων (mg/L)"></label>
  <label>Κρεατινίνη ούρων (mg/dL) <input type="number" step="0.01" name="Κρεατινίνη ούρων (mg/dL)"></label>

  <h3>Σπιρομέτρηση</h3>
  <label>FEV1 (L) <input type="number" step="0.01" name="FEV1 (L)"></label>
  <label>FEV1 (% προβλ.) <input type="number" step="0.1" name="FEV1 (% προβλ.)"></label>
  <label>FVC (L) <input type="number" step="0.01" name="FVC (L)"></label>
  <label>FVC (% προβλ.) <input type="number" step="0.1" name="FVC (% προβλ.)"></label>
  <label>FEV1/FVC (%) <input type="number" step="0.1" name="FEV1/FVC (%)"></label>
  <label>CAT score <input type="number" name="CAT score"></label>
</section>

<!-- Reh1 -->
<section class="card section" data-section="Reh1" style="display:none;">
  <h2>Reh1 (πρώτη επανεισαγωγή)</h2>
  <label>CRP (mg/L) <input type="number" step="0.1" name="CRP (mg/L)"></label>
  <label>Ινωδογόνο (mg/dL) <input type="number" name="Ινωδογόνο (mg/dL)"></label>
  <label>D-dimers (μg/mL FEU) <input type="number" step="0.1" name="D-dimers (μg/mL FEU)"></label>

  <label>Ολική χοληστερίνη (mg/dL) <input type="number" name="Ολική χοληστερίνη (mg/dL)"></label>
  <label>LDL (mg/dL) <input type="number" name="LDL (mg/dL)"></label>
  <label>HDL (mg/dL) <input type="number" name="HDL (mg/dL)"></label>
  <label>Τριγλυκερίδια (mg/dL) <input type="number" name="Τριγλυκερίδια (mg/dL)"></label>

  <label>Αλβουμίνη ούρων (mg/L) <input type="number" step="0.01" name="Αλβουμίνη ούρων (mg/L)"></label>
  <label>Κρεατινίνη ούρων (mg/dL) <input type="number" step="0.01" name="Κρεατινίνη ούρων (mg/dL)"></label>
</section>

<!-- Υποβολή -->
<section class="card">
  <button type="submit">Καταχώρηση (Κεντρικά)</button>
  <div id="status"></div>
</section>

</form>

<!-- Σύνδεση με το app.js (αποστολή στο Google Sheets & εναλλαγή καρτελών) -->
<script src="app.js"></script>

</body>
</html>
